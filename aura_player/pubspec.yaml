name: aura_player
description: A modern, clean, and minimalist multimedia player.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  media_kit: ^1.1.10
  media_kit_video: ^1.2.4
  media_kit_libs_android_audio: any
  media_kit_libs_android_video: any
  media_kit_libs_windows_video: any
  media_kit_libs_linux: any
  media_kit_libs_macos_video: any
  flutter_riverpod: ^2.5.1
  hive_ce: ^2.6.0
  hive_ce_flutter: ^2.1.0
  file_picker: ^8.1.2
  google_fonts: ^6.2.1
  path_provider: ^2.1.3
  path: ^1.9.0
  uuid: ^4.3.3
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
